<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Roman Passion — Chocolateria Artesanal | Rio de Janeiro</title>
    <meta
      name="description"
      content="Chocolateria artesanal no Rio de Janeiro. Mesas de doces para casamentos, festas e eventos corporativos. Agende sua degustação presencial."
    />
    <meta name="theme-color" content="#1f0409" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'none'; object-src 'none'"
    />

    <link rel="icon" href="/logo.png" type="image/png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Open Graph: como o link aparece ao ser compartilhado no WhatsApp.
         As URLs precisam ser ABSOLUTAS: o servidor do WhatsApp e do Facebook
         busca a imagem por fora do site, e caminho relativo ele não resolve —
         o cartão sairia sem foto. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Roman Passion" />
    <meta property="og:url" content="https://romanpassion.com.br/" />
    <meta
      property="og:title"
      content="Roman Passion — Chocolateria Artesanal"
    />
    <meta
      property="og:description"
      content="Mesas de doces com apresentação personalizada para casamentos, festas e eventos corporativos no Rio de Janeiro."
    />
    <meta
      property="og:image"
      content="https://romanpassion.com.br/logo.png"
    />
    <meta property="og:image:width" content="554" />
    <meta property="og:image:height" content="554" />
    <meta
      property="og:image:alt"
      content="Logo da Roman Passion Chocolateria Artesanal."
    />

    <meta name="twitter:card" content="summary_large_image" />

    <link rel="canonical" href="https://romanpassion.com.br/" />

    <!-- Dado estruturado (Schema.org): ajuda o Google a entender que isto é
         uma empresa local, não só uma página qualquer. Só fatos verificáveis
         no próprio site — nada de endereço aqui (não é exibido no site) ou
         nota agregada (Google exige review de verdade na página pra isso). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "Roman Passion",
        "description": "Chocolateria artesanal no Rio de Janeiro. Mesas de doces para casamentos, festas e eventos corporativos.",
        "image": "https://romanpassion.com.br/logo.png",
        "url": "https://romanpassion.com.br/",
        "telephone": "+5521994570859",
        "areaServed": "Estado do Rio de Janeiro",
        "foundingDate": "2019",
        "sameAs": [
          "https://www.instagram.com/romanpassion.chocolateria/",
          "https://www.facebook.com/RomanPassionChocolateria/",
          "https://www.casamentos.com.br/doces-casamento/roman-passion-chocolateria--e362448"
        ]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600;700&family=Kaushan+Script&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
