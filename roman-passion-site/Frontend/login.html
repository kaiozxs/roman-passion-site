<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roman Passion - Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div class="container-login">
        <div class="card-login">
            <div class="login-header">
                <div class="logo">Roman Passion</div>
                <p>Painel de Controle Executivo</p>
            </div>

            <form id="formLogin">
                <div class="input-group">
                    <label for="usuario">Usuário</label>
                    <input type="text" id="usuario" placeholder="Digite seu usuário" required autocomplete="username">
                </div>

                <div class="input-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="Digite sua senha" required autocomplete="current-password">
                </div>

                <button type="submit" class="btn-login">Entrar na Plataforma</button>
            </form>

            <div id="mensagemErro" class="mensagem-erro"></div>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
